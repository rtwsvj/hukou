name: Feature request
description: Describe a user problem and a safe outcome, not only a proposed implementation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas belong in Discussions first. Use this form when the problem and desired outcome are concrete enough to evaluate.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has the problem, in what situation, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing the implementation.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example workflow
      placeholder: |
        Before:
        ...

        After:
        ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing hukou commands, scripts, or other tools you tried.
  - type: dropdown
    id: mutation
    attributes:
      label: Does this change user files or executable state?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, compatibility, and privacy impact
      description: Consider paths, permissions, credentials, network access, rollback, manifest migration, JSON output, and telemetry.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues, Discussions, and the roadmap.
          required: true
        - label: I described the user problem separately from my preferred implementation.
          required: true
        - label: I understand that acceptance does not promise a release date.
          required: true
